version: '3.8'

services:
  # Existing Postgres Database
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: WeatherETL
      POSTGRES_PASSWORD: WeatherETL
      POSTGRES_DB: WeatherETL
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Airflow Scheduler: The "Brain" that monitors the schedule
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.11
    depends_on:
      - db
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    command: scheduler

  # Airflow Webserver: The UI for the pipeline
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.11
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
    volumes:
      - ./dags:/opt/airflow/dags
    command: webserver

volumes:
  postgres_data: