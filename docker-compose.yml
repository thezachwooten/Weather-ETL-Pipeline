services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: WeatherETL
      POSTGRES_PASSWORD: WeatherETL
      POSTGRES_DB: WeatherETL
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "WeatherETL"]
      interval: 5s
      retries: 10
      start_period: 5s

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-api-server:8080
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-api-server:8080/execution/
      - AIRFLOW__API_AUTH__JWT_SECRET=this-is-a-very-long-secret-key-that-is-at-least-64-bytes-long-ok
      - AIRFLOW__API__SECRET_KEY=supersecretapikeythisalsoneedschanging
      - PYTHONPATH=/opt/airflow
    volumes:
      - .:/opt/airflow
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    restart: on-failure

  airflow-api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-api-server:8080
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-api-server:8080/execution/
      - AIRFLOW__API_AUTH__JWT_SECRET=this-is-a-very-long-secret-key-that-is-at-least-64-bytes-long-ok
      - AIRFLOW__API__SECRET_KEY=supersecretapikeythisalsoneedschanging
      - AIRFLOW__DAG_PROCESSOR__BUNDLES=[{"name":"dags","type":"local","path":"/opt/airflow/dags"}]
      - PYTHONPATH=/opt/airflow
    volumes:
      - .:/opt/airflow
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-api-server:8080
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-api-server:8080/execution/
      - AIRFLOW__API_AUTH__JWT_SECRET=this-is-a-very-long-secret-key-that-is-at-least-64-bytes-long-ok
      - AIRFLOW__API__SECRET_KEY=supersecretapikeythisalsoneedschanging
      - AIRFLOW__DAG_PROCESSOR__BUNDLES=[{"name":"dags","type":"local","path":"/opt/airflow/dags"}]
      - PYTHONPATH=/opt/airflow
    volumes:
      - .:/opt/airflow
    command: scheduler

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-api-server:8080
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-api-server:8080/execution/
      - AIRFLOW__API_AUTH__JWT_SECRET=this-is-a-very-long-secret-key-that-is-at-least-64-bytes-long-ok
      - AIRFLOW__API__SECRET_KEY=supersecretapikeythisalsoneedschanging
      - AIRFLOW__DAG_PROCESSOR__BUNDLES=[{"name":"dags","type":"local","path":"/opt/airflow/dags"}]
      - PYTHONPATH=/opt/airflow
    volumes:
      - .:/opt/airflow
    command: dag-processor

  airflow-triggerer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://WeatherETL:WeatherETL@db:5432/WeatherETL
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__INTERNAL_API_URL=http://airflow-api-server:8080
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-api-server:8080/execution/
      - AIRFLOW__API_AUTH__JWT_SECRET=this-is-a-very-long-secret-key-that-is-at-least-64-bytes-long-ok
      - AIRFLOW__API__SECRET_KEY=supersecretapikeythisalsoneedschanging
      - PYTHONPATH=/opt/airflow
    volumes:
      - .:/opt/airflow
    command: triggerer

volumes:
  postgres_data: